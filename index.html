<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カウントダウン予定帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定帳">
<meta name="theme-color" content="#f5dfbc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fffaf3;--surface:#ffffff;--text:#4a3f3a;--sub:#9a8d85;--line:#eadfd3;--accent:#ff8f6b;--accent-t:#fff;
  --c0:#ffd6e0;--c1:#ffe0c2;--c2:#fff3b8;--c3:#d3f0d0;--c4:#cfe5ff;--c5:#e3d6ff;
  --d0:#f08aa5;--d1:#f5a65b;--d2:#e8c93c;--d3:#6fc56a;--d4:#6aa8f0;--d5:#a98af0;
  --past-bg:#efebe6;--past-t:#a39b94;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1b1a;--surface:#2a2523;--text:#f1e8e2;--sub:#a8998f;--line:#3a3330;--accent:#ff9e7d;--accent-t:#2a1a14;
    --c0:#5a3641;--c1:#5a4330;--c2:#574f2b;--c3:#365238;--c4:#33485f;--c5:#47395f;
    --d0:#ff9fba;--d1:#ffb877;--d2:#f2d85a;--d3:#8fdc8a;--d4:#86bfff;--d5:#c2a3ff;
    --past-bg:#2a2624;--past-t:#7d746e;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1b1a;--surface:#2a2523;--text:#f1e8e2;--sub:#a8998f;--line:#3a3330;--accent:#ff9e7d;--accent-t:#2a1a14;
  --c0:#5a3641;--c1:#5a4330;--c2:#574f2b;--c3:#365238;--c4:#33485f;--c5:#47395f;
  --d0:#ff9fba;--d1:#ffb877;--d2:#f2d85a;--d3:#8fdc8a;--d4:#86bfff;--d5:#c2a3ff;
  --past-bg:#2a2624;--past-t:#7d746e;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header .d small{display:block;font-size:12px;color:var(--sub)}
header .d b{font-size:20px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.jump{background:var(--accent);color:var(--accent-t);font-weight:700;padding:0 16px;height:44px;border-radius:22px;font-size:15px}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;padding:0 14px 0 14px}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:3px;background:var(--line);border-radius:2px}
.row{position:relative;padding-left:34px;margin:10px 0}
.row::before{content:"";position:absolute;left:5px;top:22px;width:15px;height:15px;border-radius:50%;background:var(--dot);border:3px solid var(--bg)}
.card{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;min-height:68px;padding:12px 14px;border-radius:18px;background:var(--cbg);border-left:7px solid var(--dot);box-shadow:0 2px 6px rgba(120,90,60,.1)}
.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;word-break:break-word}
.card .dt{font-size:12.5px;color:var(--sub);margin-top:3px}.card .n .wk{font-size:12.5px;font-weight:700;margin-top:5px;color:var(--sub)}.card .memo{font-size:14px;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(128,128,128,.4);white-space:pre-wrap;word-break:break-word;color:#000}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card .memo{color:#f5ece6}}:root[data-theme="dark"] .card .memo{color:#f5ece6}.card .n big.w{font-size:26px}.card>div:first-child{min-width:0;flex:1}
.card .n{text-align:right;flex:none;white-space:nowrap}
.card .n big{font-size:34px;font-weight:800;line-height:1}
.card .n span{font-size:13px;font-weight:700;margin:0 2px}
.card.today{box-shadow:0 0 0 3px var(--accent),0 4px 12px rgba(255,143,107,.35)}
.card.today .n big{font-size:26px;color:var(--accent)}
.card.past{background:var(--past-bg);border-left-color:var(--past-t);opacity:.7;filter:grayscale(.8)}
.card.past .t{color:var(--past-t);text-decoration:line-through;text-decoration-thickness:1px}
.card.past .n big{font-size:20px;color:var(--past-t)}
.row.past::before{background:var(--past-t)}
.card.flash{animation:fl 1.2s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{}}
.marker{position:relative;padding-left:34px;margin:14px 0;display:flex;align-items:center;gap:8px}
.marker::before{content:"";position:absolute;left:3px;top:50%;margin-top:-10px;width:19px;height:19px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.marker span{background:var(--accent);color:var(--accent-t);font-weight:800;font-size:13px;padding:4px 12px;border-radius:14px}
.marker i{flex:1;height:2px;background:var(--accent);opacity:.5;border-radius:1px}
.empty{padding:6px 0 6px 34px;color:var(--sub);font-size:13px}
footer{flex:none;padding:10px 12px 12px;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -4px 14px rgba(120,90,60,.08)}
.fr{display:flex;gap:8px;align-items:center}
.fr+.fr{margin-top:8px}
input[type=text],input[type=date]{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:14px;height:48px;padding:0 12px;min-width:0}
input:focus{outline:none;border-color:var(--accent)}
#title{flex:1}
#date{flex:1}
.add{flex:none;width:56px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-t);font-size:26px;font-weight:700}
.cols{display:flex;gap:6px;flex:none}
.sw{width:34px;height:34px;border-radius:50%;background:var(--sc);border:3px solid transparent;padding:0;position:relative}
.sw::after{content:"";position:absolute;inset:-5px}
.sw.on{border-color:var(--text);transform:scale(1.08)}
#ov,#sov{position:fixed;inset:0;background:rgba(40,25,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.show,#sov.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:17px}
.sheet label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:4px}
.sheet input,.sheet textarea{width:100%}.sheet textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:84px;resize:none}.sheet textarea:focus{outline:none;border-color:var(--accent)}.sheet{max-height:100%;overflow-y:auto}
.sheet .cols{justify-content:space-between}
.sheet .sw{width:42px;height:42px}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:50px;border-radius:14px;font-weight:700;font-size:16px;background:var(--bg);border:2px solid var(--line)}
.btns .save{background:var(--accent);color:var(--accent-t);border-color:var(--accent);flex:1.4}
.btns .del{color:#e0566b;border-color:#e0566b55}:root{--ur:#d62848;--uo:#e06a00;--ug:#218a40}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ur:#ff8a9a;--uo:#ffb066;--ug:#86e09c}}:root[data-theme="dark"]{--ur:#ff8a9a;--uo:#ffb066;--ug:#86e09c}.card .n.cr,.card .n.cr big{color:var(--ur)}.card .n.co,.card .n.co big{color:var(--uo)}.card .n.cg,.card .n.cg big{color:var(--ug)}.hr{display:flex;gap:8px;align-items:center}.gear{width:44px;height:44px;border-radius:22px;background:var(--surface);border:2px solid var(--line);font-size:20px;padding:0}.jump{white-space:nowrap}.btns.sm button{height:44px;font-size:14px;padding:0 4px}#csv{min-height:130px;font-size:13px;font-family:ui-monospace,Menlo,monospace;white-space:pre}.note{font-size:12.5px;color:var(--sub);line-height:1.5}#smsg{color:var(--accent);font-weight:700;min-height:1.2em}#sov input[type=file]{font-size:14px;height:auto;border:0;padding:0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="d"><small id="yr"></small><b id="md"></b></div>
    <div class="hr"><button class="gear" id="gear" type="button" aria-label="設定">⚙️</button><button class="jump" id="jump" type="button">📍 今日へジャンプ</button></div>
  </header>
  <div id="list"><div class="tl" id="tl"></div></div>
  <footer>
    <div class="fr">
      <input type="text" id="title" placeholder="予定の名称" enterkeyhint="done" autocomplete="off" maxlength="40">
      <button class="add" id="add" type="button" aria-label="追加">＋</button>
    </div>
    <div class="fr">
      <input type="date" id="date" aria-label="日付">
      <div class="cols" id="cols"></div>
    </div>
  </footer>
</div>

<div id="ov">
  <div class="sheet" role="dialog" aria-label="予定の編集">
    <h2>予定を編集</h2>
    <div><label>予定の名称</label><input type="text" id="etitle" maxlength="40" autocomplete="off"></div>
    <div><label>日付</label><input type="date" id="edate"></div>
    <div><label>メモ</label><textarea id="ememo" placeholder="メモを入力（任意）" maxlength="500"></textarea></div>
    <div><label>色</label><div class="cols" id="ecols"></div></div>
    <div class="btns">
      <button class="del" id="del" type="button">削除</button>
      <button id="cancel" type="button">閉じる</button>
      <button class="save" id="save" type="button">保存</button>
    </div>
  </div>
</div>

<div id="sov">
  <div class="sheet" role="dialog" aria-label="設定">
    <h2>設定：データの入出力</h2>
    <div class="btns sm">
      <button id="csvSave" type="button">CSV保存</button>
      <button id="csvCopy" type="button">CSVコピー</button>
      <button id="icsSave" type="button">ICS保存</button>
    </div>
    <div id="smsg"></div>
    <div><label>CSVデータ（形式：title,date,color,memo）</label><textarea id="csv" spellcheck="false"></textarea></div>
    <div class="btns sm">
      <button id="impAdd" type="button">追加で読み込み</button>
      <button id="impRep" type="button" class="del">置き換えて読み込み</button>
    </div>
    <div><label>またはCSVファイル（UTF-8）を選択</label><input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain"></div>
    <div class="btns sm"><button id="instBtn" type="button" class="save" style="display:none">📲 アプリとしてインストール</button></div>
    <div class="note" id="instNote"></div>
    <div class="note">復元・移行：保存したCSVの内容を貼り付けるかファイルを選び、読み込みボタンを押します。ICSは全予定を終日予定として出力するので、カレンダーアプリで開くと登録できます。color は0〜5の数字です。</div>
    <div class="btns"><button class="save" id="sclose" type="button">閉じる</button></div>
  </div>
</div>
<script>
(function(){
  var KEY="countdown_items_v1", WD=["日","月","火","水","木","金","土"];
  var items=[], selColor=0, editColor=0, editId=null, today="";
  var $=function(i){return document.getElementById(i)};
  var list=$("list"), tl=$("tl");

  function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(r))items=r.filter(function(x){return x&&x.title&&/^\d{4}-\d\d-\d\d$/.test(x.date)})}catch(e){items=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  function pad(n){return n<10?"0"+n:""+n}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function addDays(s,n){var p=s.split("-");return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
  function diff(s){var a=s.split("-"),b=today.split("-");return Math.round((Date.UTC(+a[0],+a[1]-1,+a[2])-Date.UTC(+b[0],+b[1]-1,+b[2]))/864e5)}
  function fmt(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日（"+WD[d.getDay()]+"）"}
  function dowOf(s){var p=s.split("-");return (new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7}
  function weekLabel(s){var dow=dowOf(s),w=(diff(addDays(s,-dow))+dowOf(today))/7;
    var pre=w===0?"今週の":w===-1?"先週の":w===1?"来週の":w>0?w+"週間後の":(-w)+"週間前の";
    return pre+["月","火","水","木","金","土","日"][dow]+"曜日"}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  function swatches(box,get,set){
    box.innerHTML="";
    for(var i=0;i<6;i++)(function(i){
      var b=el("button","sw"+(get()===i?" on":""));b.type="button";b.style.setProperty("--sc","var(--d"+i+")");
      b.setAttribute("aria-label","色"+(i+1));
      b.onclick=function(){set(i);swatches(box,get,set)};
      box.appendChild(b);
    })(i);
  }

  function updateHeader(){
    var n=new Date();today=ymd(n);
    $("yr").textContent=n.getFullYear()+"年 "+WD[n.getDay()]+"曜日";
    $("md").textContent=(n.getMonth()+1)+"月"+n.getDate()+"日";
  }

  function render(keep){
    var st=list.scrollTop;
    tl.innerHTML="";
    var sorted=items.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    var placed=false;
    function marker(){
      var m=el("div","marker");m.id="todayMarker";
      m.appendChild(el("span",null,"今日"));m.appendChild(el("i"));
      tl.appendChild(m);placed=true;
      return m;
    }
    var hadToday=sorted.some(function(i){return i.date===today});
    sorted.forEach(function(it){
      if(!placed&&it.date>=today){marker();}
      var d=diff(it.date),cls=d<0?"past":d===0?"today":"";
      var row=el("div","row "+(d<0?"past":""));
      var ci=(it.colorIndex>=0&&it.colorIndex<6)?it.colorIndex:0;
      row.style.setProperty("--dot","var(--d"+ci+")");
      var card=el("button","card "+cls);card.type="button";card.dataset.id=it.id;
      card.style.setProperty("--cbg","var(--c"+ci+")");
      card.style.setProperty("--dot","var(--d"+ci+")");
      var l=el("div");l.appendChild(el("div","t",it.title));l.appendChild(el("div","dt",fmt(it.date)));if(it.memo)l.appendChild(el("div","memo",it.memo));
      var n=el("div","n"+(d>=0&&d<=2?" cr":d>=0&&d<=7?" co":d>=0&&d<=30?" cg":""));
      if(d<0){n.appendChild(el("span",null,"経過"));n.appendChild(el("big",null,String(-d)));n.appendChild(el("span",null,"日"))}
      else if(d===0){n.appendChild(el("big",null,"本日"))}
      else if(d<=2){n.appendChild(el("big","w",d===1?"明日":"明後日"))}
      else{n.appendChild(el("span",null,"あと"));n.appendChild(el("big",null,String(d)));n.appendChild(el("span",null,"日"))}
      n.appendChild(el("div","wk",weekLabel(it.date)));card.appendChild(l);card.appendChild(n);
      card.onclick=function(){openEdit(it.id)};
      row.appendChild(card);tl.appendChild(row);
    });
    if(!placed)marker();
    if(!items.length){var e=el("div","empty","下の入力欄から予定を追加しましょう");tl.appendChild(e)}
    var h=list.clientHeight;
    tl.style.paddingTop="4px";
    tl.style.paddingBottom=Math.max(0,h-70)+"px";
    if(keep)list.scrollTop=st;
  }

  function jump(smooth){
    var m=$("todayMarker");if(!m)return;
    var top=m.offsetTop+tl.offsetTop-6;
    list.scrollTo({top:Math.max(0,top),behavior:smooth?"smooth":"auto"});
  }

  function addItem(){
    var t=$("title").value.trim(),d=$("date").value;
    if(!t){$("title").focus();return}
    if(!d)d=addDays(today,1);
    var it={id:uid(),title:t,date:d,colorIndex:selColor,memo:""};
    items.push(it);save();render();
    $("title").value="";$("title").focus();
    var c=tl.querySelector('[data-id="'+it.id+'"]');
    if(c){c.scrollIntoView({block:"center",behavior:"smooth"});c.classList.add("flash")}
  }

  function openEdit(id){
    var it=items.filter(function(x){return x.id===id})[0];if(!it)return;
    editId=id;editColor=it.colorIndex||0;
    $("etitle").value=it.title;$("edate").value=it.date;$("ememo").value=it.memo||"";
    swatches($("ecols"),function(){return editColor},function(i){editColor=i});
    $("ov").classList.add("show");
  }
  function closeEdit(){$("ov").classList.remove("show");editId=null}

  $("add").onclick=addItem;
  $("title").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing){e.preventDefault();addItem()}});
  $("date").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addItem()}});
  $("jump").onclick=function(){jump(true)};
  $("cancel").onclick=closeEdit;
  $("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeEdit()});
  $("save").onclick=function(){
    var t=$("etitle").value.trim(),d=$("edate").value;
    if(!t||!d){return}
    items.forEach(function(x){if(x.id===editId){x.title=t;x.date=d;x.colorIndex=editColor;x.memo=$("ememo").value.trim()}});
    save();closeEdit();render(true);
  };
  $("del").onclick=function(){
    if(!confirm("この予定を削除しますか？"))return;
    items=items.filter(function(x){return x.id!==editId});
    save();closeEdit();render(true);
  };

  /* keyboard-safe height */
  function fit(){
    var vv=window.visualViewport;
    if(vv){$("app").style.height=vv.height+"px";$("ov").style.height=$("sov").style.height=vv.height+"px";window.scrollTo(0,0)}
  }
  if(window.visualViewport){
    visualViewport.addEventListener("resize",fit);
    visualViewport.addEventListener("scroll",function(){window.scrollTo(0,0)});
  }

  function refreshDay(){
    var old=today;updateHeader();
    if(old!==today){render(true)}
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshDay()});
  setInterval(refreshDay,60000);
  window.addEventListener("resize",function(){render(true)});

  /* settings: CSV / ICS */
  function smsg(t){$("smsg").textContent=t}
  function csvCell(v){v=String(v==null?"":v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  function sortedItems(){return items.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
  function toCSV(){var rows=[["title","date","color","memo"]].concat(sortedItems().map(function(i){return [i.title,i.date,i.colorIndex||0,i.memo||""]}));return rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n")}
  function parseCSV(t){var rows=[],r=[],c="",q=false,i=0;t=t.replace(/^\uFEFF/,"");
    for(;i<t.length;i++){var ch=t[i];
      if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
      else if(ch==='"')q=true;
      else if(ch===","){r.push(c);c=""}
      else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";rows.push(r);r=[]}
      else c+=ch}
    if(c!==""||r.length){r.push(c);rows.push(r)}
    return rows}
  function normDate(s){var m=String(s).trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(!m)return null;var y=+m[1],mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return null;return y+"-"+pad(mo)+"-"+pad(d)}
  function importCSV(replace){
    var rows=parseCSV($("csv").value),out=[];
    rows.forEach(function(r){if(r.length<2)return;var d=normDate(r[1]),t=(r[0]||"").trim();if(!d||!t)return;var c=parseInt(r[2],10);if(!(c>=0&&c<6))c=0;out.push({id:uid(),title:t,date:d,colorIndex:c,memo:(r[3]||"").trim()})});
    if(!out.length){smsg("読み込める行がありません。形式：title,date,color,memo");return}
    var msg;
    if(replace){if(!confirm("現在の予定をすべて消して、"+out.length+"件に置き換えますか？"))return;items=out;msg=out.length+"件に置き換えました"}
    else{var have={};items.forEach(function(x){have[x.title+"|"+x.date]=1});var add=out.filter(function(x){return !have[x.title+"|"+x.date]});items=items.concat(add);msg=add.length+"件を追加しました（重複"+(out.length-add.length)+"件はスキップ）"}
    save();render(true);$("csv").value=toCSV();smsg(msg);
  }
  function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
  function fold(l){if(new Blob([l]).size<=72)return l;var a=Array.from(l),o=[];for(var i=0;i<a.length;i+=22)o.push(a.slice(i,i+22).join(""));return o.join("\r\n ")}
  function toICS(){var n=new Date(),st=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+"T"+pad(n.getUTCHours())+pad(n.getUTCMinutes())+pad(n.getUTCSeconds())+"Z";
    var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Countdown Planner//JA","CALSCALE:GREGORIAN"];
    sortedItems().forEach(function(i){var s=i.date.replace(/-/g,""),e=addDays(i.date,1).replace(/-/g,"");
      L.push("BEGIN:VEVENT","UID:"+i.id+"@countdown-planner","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+s,"DTEND;VALUE=DATE:"+e,"SUMMARY:"+icsEsc(i.title));
      if(i.memo)L.push("DESCRIPTION:"+icsEsc(i.memo));
      L.push("TRANSP:TRANSPARENT","END:VEVENT")});
    L.push("END:VCALENDAR");return L.map(fold).join("\r\n")+"\r\n"}
  function saveFile(name,data,fallback){
    var p=(window.claude&&claude.use)?claude.use("downloads"):Promise.resolve(null);
    return p.then(function(d){
      if(!d){if(fallback)$("csv").value=data;smsg("この環境ではファイル保存できません。"+(fallback?"下の欄にICSの内容を表示しました。コピーして使ってください。":"コピーを使ってください。"));return}
      return d.save({filename:name,data:data}).then(function(){smsg(name+" を保存しました")},function(e){smsg(e&&e.code==="declined"?"保存をキャンセルしました":"保存できませんでした")});
    },function(){smsg("保存できませんでした")});
  }
  $("gear").onclick=function(){$("csv").value=toCSV();smsg("");$("sov").classList.add("show")};
  $("sclose").onclick=function(){$("sov").classList.remove("show")};
  $("sov").addEventListener("click",function(e){if(e.target===$("sov"))$("sov").classList.remove("show")});
  $("csvSave").onclick=function(){var t=toCSV();$("csv").value=t;saveFile("countdown_"+today+".csv","\uFEFF"+t)};
  $("icsSave").onclick=function(){if(!items.length){smsg("出力する予定がありません");return}saveFile("countdown_"+today+".ics",toICS(),true)};
  $("csvCopy").onclick=function(){
    var ta=$("csv");ta.value=toCSV();
    function fb(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}smsg(ok?"コピーしました":"選択状態にしました。長押しでコピーしてください")}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){smsg("コピーしました")},fb)}else fb();
  };
  $("impAdd").onclick=function(){importCSV(false)};
  $("impRep").onclick=function(){importCSV(true)};
  $("csvFile").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){$("csv").value=String(rd.result||"");smsg("ファイルを読み込みました。下のボタンで取り込みます")};rd.readAsText(f,"utf-8")};

  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
  /* PWA install */
  var dip=null;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;$("instBtn").style.display="block"});
  $("instBtn").onclick=function(){if(!dip)return;dip.prompt();dip.userChoice.then(function(){dip=null;$("instBtn").style.display="none"})};
  window.addEventListener("appinstalled",function(){$("instBtn").style.display="none";$("instNote").textContent="インストールしました"});
  var sa=window.matchMedia&&matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  var isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $("instNote").textContent=sa?"アプリとして起動中です":isIos?"iPhone/iPadは、Safariの共有ボタンから「ホーム画面に追加」を選んでください。":"Chromeでインストールできる状態になると、ここにインストールボタンが出ます。出ない場合はメニューの「アプリをインストール」または「ホーム画面に追加」を使ってください。";

  /* init */
  load();updateHeader();
  $("date").value=addDays(today,1);
  swatches($("cols"),function(){return selColor},function(i){selColor=i});
  render();fit();
  requestAnimationFrame(function(){jump(false)});
})();
</script>
